[package]
name = "novamix-device-api"
description = "Platform-neutral device abstraction (enumeration, streams, virtual endpoints) with a CPAL backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["cpal-backend", "wasapi-lowlatency"]
cpal-backend = ["dep:cpal"]
# NovaMix's own WASAPI backend (IAudioClient3 small periods, optional
# exclusive mode); hosts "wasapi-lowlatency" and "wasapi-exclusive". Windows only.
wasapi-lowlatency = ["dep:windows"]
# Steinberg ASIO support through CPAL (requires the ASIO SDK, see docs/audio-performance.md).
asio = ["cpal-backend", "cpal/asio"]

[dependencies]
cpal = { workspace = true, optional = true, features = ["realtime"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }
