name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Performance budget (release)
        run: cargo test --release -p novamix-tests --test performance
      - name: Benchmark
        run: cargo run --release -p novamix-cli -- bench --channels 8 --block 128 --seconds 5
