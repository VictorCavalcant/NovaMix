# NovaMix virtual endpoints for PipeWire (development / phase 6).
# Copy to ~/.config/pipewire/pipewire.conf.d/ and restart PipeWire.
# Node descriptions follow the contract used by the NovaMix app.

context.objects = [
    {   # Apps play into this sink; NovaMix captures its monitor.
        factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "novamix_virtual_playback"
            node.description = "NovaMix Virtual Playback"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            monitor.channel-volumes = true
        }
    }
]

context.modules = [
    {   # NovaMix writes the voice bus to "Mic Feed"; apps record "Virtual Mic".
        name = libpipewire-module-loopback
        args = {
            node.description = "NovaMix Virtual Mic"
            audio.position   = [ FL FR ]
            capture.props = {
                node.name        = "novamix_mic_feed"
                node.description = "NovaMix Mic Feed"
                media.class      = Audio/Sink
            }
            playback.props = {
                node.name        = "novamix_virtual_mic"
                node.description = "NovaMix Virtual Mic"
                media.class      = Audio/Source
                node.passive     = true
            }
        }
    }
]
